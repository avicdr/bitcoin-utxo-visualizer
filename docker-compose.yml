version: '3.8'

services:
  bitcoin-core:
    image: ruimarinho/bitcoin-core:27.0
    container_name: utxo-bitcoin-core
    restart: unless-stopped
    command:
      - -regtest
      - -server=1
      - -txindex=1
      - -fallbackfee=0.0002
      - -rpcuser=regtest
      - -rpcpassword=regtest
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcport=18443
      - -zmqpubrawtx=tcp://0.0.0.0:28332
      - -zmqpubhashblock=tcp://0.0.0.0:28333
      - -printtoconsole=1
    ports:
      - "18443:18443"
      - "28332:28332"
      - "28333:28333"
    volumes:
      - bitcoin_data:/home/bitcoin/.bitcoin

  postgres:
    image: postgres:16-alpine
    container_name: utxo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bitcoin_utxo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bitcoin_utxo"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: utxo-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      bitcoin-core:
        condition: service_started
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/bitcoin_utxo
      BITCOIN_RPC_URL: http://bitcoin-core:18443
      BITCOIN_RPC_USER: regtest
      BITCOIN_RPC_PASSWORD: regtest
      BITCOIN_NETWORK: regtest
      BITCOIN_ZMQ_RAWTX: tcp://bitcoin-core:28332
      BITCOIN_ZMQ_HASHBLOCK: tcp://bitcoin-core:28333
      HOST: 0.0.0.0
      PORT: 8080
      RUST_LOG: info,bitcoin_utxo_backend=debug
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: utxo-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  bitcoin_data:
  postgres_data:
