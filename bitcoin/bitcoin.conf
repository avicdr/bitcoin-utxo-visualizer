# Bitcoin Core Regtest Configuration
regtest=1

[regtest]
server=1
txindex=1
listen=1
fallbackfee=0.0002

# RPC Configuration
rpcuser=regtest
rpcpassword=regtest
rpcport=18443
rpcbind=0.0.0.0
rpcallowip=0.0.0.0/0
rpcthreads=16

# ZeroMQ (ZMQ) Notifications
zmqpubrawtx=tcp://0.0.0.0:28332
zmqpubhashblock=tcp://0.0.0.0:28333

# Performance and Memory
dbcache=256
maxmempool=300
printtoconsole=1
